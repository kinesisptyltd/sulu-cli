          image: "722349771793.dkr.ecr.ap-southeast-2.amazonaws.com/bookworm-rust:latest"
          mount-ssh-agent: true
          environment:
            - "AWS_DEFAULT_REGION"
            - "CI"
            - "BUILDKITE_COMMIT"
            - "BUILDKITE_BRANCH"
